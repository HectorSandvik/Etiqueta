<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiqueta de bulto</title>
<style>
  @font-face {
    font-family: "Sandvik Sans Headline";
    src: local("Sandvik Sans Headline"), local("SandvikSansHeadline-Regular"),
         url("SandvikSansHeadline-Regular.woff2") format("woff2"),
         url("SandvikSansHeadline-Regular.ttf") format("truetype");
  }
  :root { --beige: #DDD4C1; --linea: #2D2B27; --gris: #3A3A3A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #ECEAE6; }
  body { font-family: "Sandvik Sans Headline", "Sandvik Sans", Arial, Helvetica, sans-serif; color: #000; padding: 12px 0 24px; }
  #escala { width: 100%; overflow: hidden; }
  .hoja { width: 560px; background: #fff; padding: 22px 20px 18px; margin: 0 auto; transform-origin: top left;
          box-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .logo { height: 21px; display: block; }
  h1 { font-weight: 400; font-size: 21px; text-align: center; margin: 9px 0 0; letter-spacing: .2px; }
  .cab { display: flex; justify-content: space-between; align-items: flex-start; margin-top: 12px; }
  .bulto { font-size: 20px; margin: 4px 0 16px; }
  .datos { display: grid; grid-template-columns: 84px auto; row-gap: 10px; font-size: 13px; }
  .datos dt { color: var(--gris); font-size: 12.5px; }
  .datos dd { margin: 0; color: #1A1A1A; }
  .qr { width: 96px; height: 96px; image-rendering: pixelated; flex: none; margin-top: 2px; }
  table { width: 100%; border-collapse: collapse; margin-top: 30px; border: 2px solid var(--linea); font-size: 14.5px; }
  th, td { border: 1px solid var(--linea); padding: 3px 6px; }
  th { background: var(--beige); font-weight: 400; font-size: 16.5px; }
  td.c { text-align: center; }
  tr.total td { background: var(--beige); font-size: 16.5px; border-top: 1px solid var(--linea); }
  tr.total td.l { text-align: right; }
  .pie { font-style: italic; font-size: 11px; color: var(--gris); margin-top: 5px; }
  .acciones { text-align: center; margin: 16px 0 0; }
  .acciones button { font: inherit; font-size: 15px; padding: 9px 18px; border-radius: 6px; border: 1px solid #8a8378;
                     background: #fff; color: #222; cursor: pointer; }
  .vacio { width: 560px; margin: 0 auto; background: #fff; padding: 28px 24px; font-size: 15px; line-height: 1.5; }
  @media print {
    html, body { background: #fff; padding: 0; }
    .hoja { box-shadow: none; transform: none !important; margin: 0; }
    #escala { height: auto !important; }
    .acciones { display: none; }
    @page { size: letter; margin: 0.5in; }
  }
</style>
</head>
<body>
<div id="escala"><div class="hoja" id="hoja"></div></div>
<div class="acciones" id="acciones"><button type="button" onclick="window.print()">Imprimir / guardar PDF</button></div>

function utf8(s) {
  const out = [];
  for (let i = 0; i < s.length; i++) {
    let c = s.charCodeAt(i);
    if (c >= 0xd800 && c <= 0xdbff && i + 1 < s.length) {
      const c2 = s.charCodeAt(i + 1);
      if (c2 >= 0xdc00 && c2 <= 0xdfff) {
        c = 0x10000 + ((c - 0xd800) << 10) + (c2 - 0xdc00);
        i++;
      }
    }
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return out;
}

function qrNumRawDataModules(ver) {
  let result = (16 * ver + 128) * ver + 64;
  if (ver >= 2) {
    const numAlign = Math.floor(ver / 7) + 2;
    result -= (25 * numAlign - 10) * numAlign - 55;
    if (ver >= 7) result -= 36;
  }
  return result;
}

function qrNumDataCodewords(ver, ecl) {
  return Math.floor(qrNumRawDataModules(ver) / 8) - ECC_CODEWORDS_PER_BLOCK[ecl][ver] * NUM_ERROR_CORRECTION_BLOCKS[ecl][ver];
}

function rsMul(x, y) {
  let z = 0;
  for (let i = 7; i >= 0; i--) {
    z = (z << 1) ^ ((z >>> 7) * 0x11d);
    z ^= ((y >>> i) & 1) * x;
  }
  return z & 0xff;
}

function rsDivisor(degree) {
  const result = [];
  for (let i = 0; i < degree - 1; i++) result.push(0);
  result.push(1);
  let root = 1;
  for (let i = 0; i < degree; i++) {
    for (let j = 0; j < result.length; j++) {
      result[j] = rsMul(result[j], root);
      if (j + 1 < result.length) result[j] ^= result[j + 1];
    }
    root = rsMul(root, 0x02);
  }
  return result;
}

function rsRemainder(data, divisor) {
  const result = divisor.map(() => 0);
  for (let k = 0; k < data.length; k++) {
    const primero = result.shift();
    const factor = data[k] ^ (primero === undefined ? 0 : primero);
    result.push(0);
    for (let i = 0; i < divisor.length; i++) result[i] ^= rsMul(divisor[i], factor);
  }
  return result;
}

/** Devuelve la matriz de módulos (true = negro) o [] si el texto no cabe. */
function qrEncode(bytes, ecl) {
  // Elegir versión
  let ver = 1;
  let dataCap = 0;
  for (; ver <= 40; ver++) {
    dataCap = qrNumDataCodewords(ver, ecl) * 8;
    const ccBits = ver < 10 ? 8 : 16;
    if (bytes.length < 1 << ccBits && 4 + ccBits + bytes.length * 8 <= dataCap) break;
  }
  if (ver > 40) return [];

  // Flujo de bits
  const bits = [];
  const append = (val, len) => {
    for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1);
  };
  append(4, 4);
  append(bytes.length, ver < 10 ? 8 : 16);
  bytes.forEach((b) => append(b, 8));
  append(0, Math.min(4, dataCap - bits.length));
  append(0, (8 - (bits.length % 8)) % 8);
  for (let pad = 0xec; bits.length < dataCap; pad ^= 0xec ^ 0x11) append(pad, 8);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let v = 0;
    for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
    data.push(v);
  }

  // Corrección de errores e intercalado
  const numBlocks = NUM_ERROR_CORRECTION_BLOCKS[ecl][ver];
  const blockEccLen = ECC_CODEWORDS_PER_BLOCK[ecl][ver];
  const rawCodewords = Math.floor(qrNumRawDataModules(ver) / 8);
  const numShortBlocks = numBlocks - (rawCodewords % numBlocks);
  const shortBlockLen = Math.floor(rawCodewords / numBlocks);
  const blocks = [];
  const div = rsDivisor(blockEccLen);
  for (let i = 0, k = 0; i < numBlocks; i++) {
    const dat = data.slice(k, k + shortBlockLen - blockEccLen + (i < numShortBlocks ? 0 : 1));
    k += dat.length;
    const ecc = rsRemainder(dat, div);
    if (i < numShortBlocks) dat.push(0);
    blocks.push(dat.concat(ecc));
  }
  const codewords = [];
  for (let i = 0; i < blocks[0].length; i++) {
    for (let j = 0; j < blocks.length; j++) {
      if (i !== shortBlockLen - blockEccLen || j >= numShortBlocks) codewords.push(blocks[j][i]);
    }
  }

  // Matriz
  const size = ver * 4 + 17;
  const mods = [];
  const isFn = [];
  for (let y = 0; y < size; y++) {
    const r1 = [];
    const r2 = [];
    for (let x = 0; x < size; x++) {
      r1.push(false);
      r2.push(false);
    }
    mods.push(r1);
    isFn.push(r2);
  }
  const setFn = (x, y, dark) => {
    mods[y][x] = dark;
    isFn[y][x] = true;
  };

  // Patrones de temporización
  for (let i = 0; i < size; i++) {
    setFn(6, i, i % 2 === 0);
    setFn(i, 6, i % 2 === 0);
  }
  // Patrones de búsqueda
  const finder = (cx, cy) => {
    for (let dy = -4; dy <= 4; dy++) {
      for (let dx = -4; dx <= 4; dx++) {
        const dist = Math.max(Math.abs(dx), Math.abs(dy));
        const xx = cx + dx;
        const yy = cy + dy;
        if (xx >= 0 && xx < size && yy >= 0 && yy < size) setFn(xx, yy, dist !== 2 && dist !== 4);
      }
    }
  };
  finder(3, 3);
  finder(size - 4, 3);
  finder(3, size - 4);
  // Patrones de alineación
  const alignPos = [];
  if (ver > 1) {
    const numAlign = Math.floor(ver / 7) + 2;
    const step = ver === 32 ? 26 : Math.ceil((ver * 4 + 4) / (numAlign * 2 - 2)) * 2;
    alignPos.push(6);
    for (let pos = size - 7; alignPos.length < numAlign; pos -= step) alignPos.splice(1, 0, pos);
  }
  const na = alignPos.length;
  for (let i = 0; i < na; i++) {
    for (let j = 0; j < na; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === na - 1) || (i === na - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {
          setFn(alignPos[i] + dx, alignPos[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
        }
      }
    }
  }
  // Bits de formato
  const drawFormat = (mask) => {
    const d = (ECC_FORMAT_BITS[ecl] << 3) | mask;
    let rem = d;
    for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
    const fb = ((d << 10) | rem) ^ 0x5412;
    const bit = (i) => ((fb >>> i) & 1) !== 0;
    for (let i = 0; i <= 5; i++) setFn(8, i, bit(i));
    setFn(8, 7, bit(6));
    setFn(8, 8, bit(7));
    setFn(7, 8, bit(8));
    for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) setFn(size - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) setFn(8, size - 15 + i, bit(i));
    setFn(8, size - 8, true);
  };
  drawFormat(0);
  // Bits de versión
  if (ver >= 7) {
    let rem = ver;
    for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
    const vb = (ver << 12) | rem;
    for (let i = 0; i < 18; i++) {
      const b = ((vb >>> i) & 1) !== 0;
      const a = size - 11 + (i % 3);
      const c = Math.floor(i / 3);
      setFn(a, c, b);
      setFn(c, a, b);
    }
  }
  // Datos en zigzag
  let bi = 0;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (!isFn[y][x] && bi < codewords.length * 8) {
          mods[y][x] = ((codewords[bi >>> 3] >>> (7 - (bi & 7))) & 1) !== 0;
          bi++;
        }
      }
    }
  }
  // Máscara
  const applyMask = (m) => {
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let inv = false;
        if (m === 0) inv = (x + y) % 2 === 0;
        else if (m === 1) inv = y % 2 === 0;
        else if (m === 2) inv = x % 3 === 0;
        else if (m === 3) inv = (x + y) % 3 === 0;
        else if (m === 4) inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0;
        else if (m === 5) inv = ((x * y) % 2) + ((x * y) % 3) === 0;
        else if (m === 6) inv = (((x * y) % 2) + ((x * y) % 3)) % 2 === 0;
        else inv = (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
        if (!isFn[y][x] && inv) mods[y][x] = !mods[y][x];
      }
    }
  };
  let bestMask = 0;
  let minPen = Number.MAX_VALUE;
  for (let m = 0; m < 8; m++) {
    applyMask(m);
    drawFormat(m);
    const p = qrPenalty(mods);
    if (p < minPen) {
      minPen = p;
      bestMask = m;
    }
    applyMask(m); // deshacer
  }
  applyMask(bestMask);
  drawFormat(bestMask);
  return mods;
}

function qrPenalty(m) {
  const size = m.length;
  let pen = 0;
  let dark = 0;
  const lineas = [];
  for (let y = 0; y < size; y++) lineas.push(m[y]);
  for (let x = 0; x < size; x++) {
    const col = [];
    for (let y = 0; y < size; y++) col.push(m[y][x]);
    lineas.push(col);
  }
  const p1 = [true, false, true, true, true, false, true, false, false, false, false];
  const p2 = [false, false, false, false, true, false, true, true, true, false, true];
  lineas.forEach((l) => {
    let run = 1;
    for (let i = 1; i <= size; i++) {
      if (i < size && l[i] === l[i - 1]) run++;
      else {
        if (run >= 5) pen += 3 + (run - 5);
        run = 1;
      }
    }
    for (let i = 0; i + 11 <= size; i++) {
      let a = true;
      let b = true;
      for (let k = 0; k < 11; k++) {
        if (l[i + k] !== p1[k]) a = false;
        if (l[i + k] !== p2[k]) b = false;
      }
      if (a) pen += 40;
      if (b) pen += 40;
    }
  });
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      if (m[y][x]) dark++;
      if (x < size - 1 && y < size - 1) {
        const c = m[y][x];
        if (c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) pen += 3;
      }
    }
  }
  const total = size * size;
  const k = Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1;
  pen += Math.max(0, k) * 10;
  return pen;
}



function dec(s) { try { return decodeURIComponent((s || "").replace(/\+/g, " ")); } catch (e) { return s || ""; } }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function cant(n) { const x = Number(n); return isNaN(x) ? n : String(Math.round(x * 100) / 100).replace(".", ","); }

function qrDataUrl(texto) {
  const m = qrEncode(utf8(texto), ECC_L);
  if (!m.length) return "";
  const borde = 4, n = m.length + borde * 2, esc = 6, cv = document.createElement("canvas");
  cv.width = cv.height = n * esc;
  const g = cv.getContext("2d");
  g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); g.fillStyle = "#000";
  for (let y = 0; y < m.length; y++) for (let x = 0; x < m.length; x++)
    if (m[y][x]) g.fillRect((x + borde) * esc, (y + borde) * esc, esc, esc);
  return cv.toDataURL("image/png");
}

function leer() {
  const h = location.hash.replace(/^#/, "");
  if (!h) return null;
  const p = h.split("!");
  if (p[0] !== "1" || p.length < 8) return null;
  const items = (p[7] ? p[7].split("~") : []).map(t => { const f = t.split("*"); return { cod: dec(f[0]), desc: dec(f[1]), cant: dec(f[2]) }; });
  return { pl: dec(p[1]), n: p[2], total: p[3], packing: dec(p[4]), cliente: dec(p[5]), ref: dec(p[6]), items };
}

function dibujar() {
  const d = leer(), hoja = document.getElementById("hoja");
  if (!d) {
    document.getElementById("escala").innerHTML = '<div class="vacio"><img class="logo" src="' + LOGO + '" alt="Sandvik"><p>Esta p&aacute;gina muestra la etiqueta de un bulto al escanear el c&oacute;digo QR pegado en la caja.</p></div>';
    document.getElementById("acciones").style.display = "none";
    return;
  }
  const suma = d.items.reduce((a, it) => a + (Number(it.cant) || 0), 0);
  const uni = suma === 1 ? " unidad" : " unidades";
  document.title = d.pl + " - Bulto " + d.n + " de " + d.total;
  const filas = d.items.map((it, i) => '<tr><td class="c">' + (i + 1) + '</td><td>' + esc(it.cod) + '</td><td>' + esc(it.desc) +
                                       '</td><td class="c">' + esc(cant(it.cant)) + '</td></tr>').join("");
  hoja.innerHTML =
    '<img class="logo" src="' + LOGO + '" alt="Sandvik">' +
    '<h1>PACKING LIST</h1>' +
    '<div class="cab"><div><div class="bulto">BULTO ' + esc(d.n) + ' DE ' + esc(d.total) + '</div>' +
    '<dl class="datos"><dt>Packing List:</dt><dd>' + esc(d.pl) + '</dd>' +
    '<dt>Packing N\u00b0:</dt><dd>' + esc(d.packing || "-") + '</dd>' +
    '<dt>Cliente:</dt><dd>' + esc(d.cliente || "-") + '</dd>' +
    '<dt>Ref. Cliente:</dt><dd>' + esc(d.ref || "-") + '</dd>' +
    '<dt>Contenido:</dt><dd>' + d.items.length + ' \u00edtem(s) / ' + cant(suma) + uni + '</dd></dl></div>' +
    '<img class="qr" alt="QR" src="' + qrDataUrl(location.href) + '"></div>' +
    '<table><colgroup><col style="width:34px"><col style="width:122px"><col><col style="width:104px"></colgroup>' +
    '<thead><tr><th>N\u00b0</th><th>C\u00f3digo</th><th>Descripci\u00f3n</th><th>Cantidad</th></tr></thead>' +
    '<tbody>' + filas + '<tr class="total"><td class="l" colspan="3">TOTAL UNIDADES EN ESTE BULTO</td><td class="c">' + cant(suma) + '</td></tr></tbody></table>' +
    '<div class="pie">Escanee el c\u00f3digo QR para ver el contenido del bulto sin abrirlo.&nbsp;&nbsp; ' + esc(d.pl) + ' - Bulto ' + esc(d.n) + ' de ' + esc(d.total) + '</div>';
  ajustar();
}

// La hoja se dibuja a 560 px de ancho (igual que la etiqueta) y se escala al ancho del celular.
function ajustar() {
  const hoja = document.getElementById("hoja"), cont = document.getElementById("escala");
  if (!hoja.innerHTML) return;
  const ancho = Math.min(window.innerWidth - 16, 560), k = ancho / 560;
  hoja.style.transform = "scale(" + k + ")";
  hoja.style.marginLeft = ((window.innerWidth - ancho) / 2) + "px";
  cont.style.height = (hoja.offsetHeight * k) + "px";
}
window.addEventListener("resize", ajustar);
window.addEventListener("hashchange", dibujar);
dibujar();
</script>
